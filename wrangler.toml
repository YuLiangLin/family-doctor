name = "family-doctor"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
# 預覽網址不受 Access 保護的風險 → 關掉
preview_urls = false

# 正式網址（Worker custom domain；DNS 與憑證由 Cloudflare 自動建立）。部署用的 API token 要有 Zone → Workers Routes → Edit。
routes = [{ pattern = "doctor.lottery-wangwang.com", custom_domain = true }]

# 後台另外加的變數（例如 BOOTSTRAP_ADMINS）部署時不會被清掉
keep_vars = true

[dev]
host = "127.0.0.1"

# 前端 SPA；/api/* 一律先進 Worker
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "family-doctor"
# 部署指南 §2：wrangler d1 create family-doctor 之後把 id 貼到這裡
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 藥袋、收據、病灶照片（私有 bucket，只能經由 /api/attachments 讀取）
[[r2_buckets]]
binding = "FILES"
bucket_name = "family-doctor-files"

# Cloudflare Access（Zero Trust team nathantw，跟二胎同一個 team；這個 Worker 要另外建一個 Access 應用程式）。
# 兩個值都不是機密。沒設或設錯 → API 一律拒絕（fail closed）。
[vars]
ACCESS_TEAM_DOMAIN = "https://nathantw.cloudflareaccess.com"
# 部署指南 §3：建好 Access 應用程式後把 AUD tag 貼到這裡
ACCESS_AUD = ""
# 最高管理者（逗號分隔）：只有他能新增、停用家人帳號
SUPER_ADMINS = "yliang.lin@gmail.com"
# 手機通知（Web Push）：公鑰貼這裡，私鑰是 Worker secret VAPID_PRIVATE_KEY（部署指南 §5）
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "https://doctor.lottery-wangwang.com"

# 吃藥提醒（台北 08:00、12:30、18:30、21:30 = UTC 00:00、04:30、10:30、13:30），對應 src/shared/meds.ts 的 SLOTS
[triggers]
crons = ["0 0 * * *", "30 4 * * *", "30 10 * * *", "30 13 * * *"]
