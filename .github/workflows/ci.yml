name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    # 跑在哪台機器：repo variable RUNNER（自架 runner 設 self-hosted）；沒設就用 GitHub 的 ubuntu-latest。見 docs/部署指南.md §1
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test Dr.Claude runner
        run: python3 -m unittest scripts/dr-claude-runner/test_runner.py
      - name: Build
        run: npx vite build
