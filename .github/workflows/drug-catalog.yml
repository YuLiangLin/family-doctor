name: Drug catalog

# 食藥署開放資料「藥品外觀」→ D1 的 drug_catalog（藥品照片要用；src/shared/drugs.ts、scripts/sync-drug-catalog.ts）。
# 每週一台北 03:17 同步一次，也可以在 Actions 頁手動跑（第一次部署後要手動跑一次）。
on:
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:

concurrency:
  group: drug-catalog
  cancel-in-progress: false

jobs:
  sync:
    # 跑在哪台機器：repo variable RUNNER（自架 runner 設 self-hosted）；沒設就用 GitHub 的 ubuntu-latest。見 docs/部署指南.md §1
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync drug catalog
        run: node --experimental-strip-types scripts/sync-drug-catalog.ts --remote
