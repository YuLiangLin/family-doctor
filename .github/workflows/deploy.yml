name: Deploy

# push 到 main：檢查 → 套用 D1 migrations → 部署 Worker。
# 需要 repo secrets CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（見 docs/部署指南.md）；沒設的話只跑檢查、不部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 跑在哪台機器：repo variable RUNNER（自架 runner 設 self-hosted）；沒設就用 GitHub 的 ubuntu-latest。見 docs/部署指南.md §1
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test Dr.Claude runner
        run: python3 -m unittest scripts/dr-claude-runner/test_runner.py
      - name: Build
        run: npx vite build
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::還沒設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID，這次只檢查不部署"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler deploy
