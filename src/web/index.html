<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="家庭醫生" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <!-- 2026-11-05 搬到 doctor.nathantw.com：舊網址打開畫面就轉過去（API 兩個網址都還能用；src/web/moved.ts、部署指南 §9） -->
    <script>
      if (location.hostname === 'doctor.lottery-wangwang.com') {
        location.replace('https://doctor.nathantw.com' + location.pathname + (location.search ? location.search + '&' : '?') + 'moved=1' + location.hash);
      }
    </script>
    <!-- 設定頁選了亮色／暗色：畫面出來前先套用，不會閃一下（src/web/theme.ts） -->
    <script>
      try {
        var t = localStorage.getItem('fd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" />
    <title>家庭醫生</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
